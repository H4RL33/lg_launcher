version: 2
updates:
  - package-ecosystem: nuget
    target-branch: dev
    directories:
      - /avalonia/LGLauncher.Components
      - /avalonia/LGLauncher.Desktop
      - /avalonia/LGLauncher.Gallery
      - /tests
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build(deps)'
    groups:
      graphics:
        patterns:
          - Avalonia
          - 'Avalonia.*'
          - SkiaSharp
          - 'SkiaSharp.NativeAssets.*'

  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
