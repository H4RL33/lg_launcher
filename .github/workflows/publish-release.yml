name: Publish LG Launcher release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Verify and publish the release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vX.Y.Z tag." >&2
            exit 1
          fi
          cd "$(mktemp -d)"
          git init --quiet
          git fetch --quiet --no-tags --depth=1 "https://github.com/$GH_REPO.git" "refs/heads/release-assets/$RELEASE_TAG"
          git archive FETCH_HEAD -- 'LG Launcher.exe' 'LG Launcher.exe.sha256' RELEASE-NOTES.md | tar -xf -
          sha256sum --check 'LG Launcher.exe.sha256'
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" != true ]]; then
              echo "This release is already published." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "LG Launcher ${RELEASE_TAG#v}" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" --clobber 'LG Launcher.exe' 'LG Launcher.exe.sha256'
          gh release edit "$RELEASE_TAG" --draft=false --latest
