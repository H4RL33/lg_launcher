name: Relabel LG Launcher release history

on:
  push:
    tags:
      - 'release-history-0.1'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update the five historical release titles
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = v0.1.6
          rename() {
            local tag="$1" title="$2" release_id
            release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')"
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f "name=$title" --jq '[.tag_name, .name] | @tsv'
          }
          rename v1.1.1 'LG Launcher 0.1.1'
          rename v1.1.2 'LG Launcher 0.1.2'
          rename v1.2.0 'LG Launcher 0.1.3'
          rename v1.2.1 'LG Launcher 0.1.4'
          rename v1.2.2 'LG Launcher 0.1.5'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = v0.1.6
